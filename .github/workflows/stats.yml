name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=teles-hub&show_icons=true&include_all_commits=true&theme=github_dark&title_color=4DA6FF&icon_color=4DA6FF&text_color=C9D1D9&bg_color=05070D&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=teles-hub&layout=compact&langs_count=8&theme=github_dark&title_color=4DA6FF&text_color=C9D1D9&bg_color=05070D&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Project - Algoritmos
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=teles-hub&repo=Algoritmos-e-Programa-o&theme=github_dark&title_color=4DA6FF&icon_color=4DA6FF&text_color=C9D1D9&bg_color=05070D&hide_border=true
          path: profile/projeto-algoritmos.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Project - Aprendendo em casa
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=teles-hub&repo=Aprendendo-em-casa&theme=github_dark&title_color=4DA6FF&icon_color=4DA6FF&text_color=C9D1D9&bg_color=05070D&hide_border=true
          path: profile/projeto-aprendendo.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=teles-hub&theme=onedark&no-frame=true&no-bg=true&margin-w=4
          path: profile/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update GitHub profile cards"
          git push
